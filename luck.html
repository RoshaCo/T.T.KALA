<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بررسی شانس | قرعه‌کشی بزرگ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="luck-page">

    <!-- هدر -->
    <header class="header-small">
        <button onclick="goBack()" class="btn-back">→</button>
        <h1>🎲 بررسی شانس</h1>
    </header>

    <!-- بخش چک شانس -->
    <section class="luck-check-section">
        <div class="luck-card">
            <!-- مرحله ۱: ورود شماره -->
            <div id="step1">
                <div class="luck-icon">🔮</div>
                <h2>شانس برنده شدنت چقدره؟</h2>
                <p>شماره موبایلت رو وارد کن تا بفهمی!</p>
                
                <div class="input-group">
                    <input type="tel" id="phoneInput" placeholder="09123456789" maxlength="11">
                    <button onclick="checkLuck()" class="btn-luck">بررسی شانس</button>
                </div>
            </div>

            <!-- مرحله ۲: در حال محاسبه -->
            <div id="step2" class="hidden">
                <div class="calculating-animation">
                    <div class="spinner"></div>
                    <p>⏳ در حال محاسبه شانس تو...</p>
                    <p class="calculating-text">در حال بررسی ستاره‌ها ✨</p>
                </div>
            </div>

            <!-- مرحله ۳: نتیجه -->
            <div id="step3" class="hidden">
                <div class="result-content">
                    <div class="result-icon" id="resultIcon">🎉</div>
                    <h2>شانس تو مشخص شد!</h2>
                    
                    <div class="luck-percentage">
                        ✨ شانس تو: <span id="luckPercent">۰٪</span>
                    </div>
                    
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                    
                    <p id="luckMessage" class="luck-message"></p>
                    
                    <div class="comparison-box">
                        <p>📊 میانگین شانس خریداران: <strong>۹۵٪</strong></p>
                        <p>📊 میانگین شانس غیرخریداران: <strong>۵۰٪</strong></p>
                    </div>
                    
                    <div class="action-buttons">
                        <button onclick="goToProducts()" class="btn-buy">
                            🛒 خرید کن و شانست رو ۲ برابر کن!
                        </button>
                        <button onclick="resetLuck()" class="btn-secondary">
                            🔄 دوباره چک کن
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
  </html>
